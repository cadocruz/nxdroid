plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nxdroid'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.nxdroid"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=29",
                          "-DANDROID_ABI=arm64-v8a",
                          "-DGAME=${project.findProperty('dmGame') ?: ''}"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.31.6"
        }
    }

    ndkVersion "29.0.14206865"
}

dependencies {
}
