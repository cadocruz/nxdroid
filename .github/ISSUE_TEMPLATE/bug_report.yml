name: Bug report
description: A game that crashes, hangs, draws wrong or runs slowly, or a script or build step that fails
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fields below are what a problem is usually traced with; without them the first reply is a request for them.
        Never attach game files, keys, title keys or anything extracted from a game (RomFS, NSOs, shaders). Logs and screenshots are fine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw. The last log lines, a `[RED]` line or a screenshot help. Say whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: input
    id: game
    attributes:
      label: Game, title ID and version
      description: The base game's title ID and the update you packed (display version or v-number), and DLC if any.
      placeholder: "The Legend of Zelda: Breath of the Wild, 01007EF00011E000, 1.9.0 (v1114112)"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: nxdroid commit
      description: "`git rev-parse --short HEAD` in the checkout you built from (or the date you downloaded it)."
      placeholder: 4639c511
    validations:
      required: true
  - type: input
    id: chain
    attributes:
      label: Shader chain version
      description: "`grep DMSH_CHAIN dm/gfx/nvn/dmsh_chain.h` in the checkout the game was prepared with."
      placeholder: 5cddc47253ab
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How it was built and run
      options:
        - APK (com.nxdroid) built with Gradle, game prepared with prepare_game_android.py
        - dmhost from adb shell
        - Built by hand (CMake with the NDK, Gradle)
        - prepare_game_android.py failed before anything ran
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      description: The phone model with its chip and GPU, and the Android version (Settings > About phone).
      placeholder: Galaxy S23 Ultra, Snapdragon 8 Gen 2 / Adreno 740, Android 16
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Marker files and environment overrides
      description: "The `gfx-*` marker files in the game folder and what each holds (`scripts/android_gfx_ab.py --list`), and any `DM_*` variables you set for `dmhost`. Write \"none\" if there are none."
      placeholder: "gfx-noload = 0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Attach the whole log from the start of the run (drag the file here), not excerpts:
        - The app: `adb logcat -c` before starting the game, then `adb logcat -d -s dm > log.txt` after the problem
        - `dmhost` from `adb shell`: its output, e.g. the command followed by `2>&1 | tee run.log`
        - Graphics problems: a screenshot too (`adb exec-out screencap -p > shot.png`)
        - Script or build failures: the script's or Gradle's full console output
    validations:
      required: true
  - type: checkboxes
    id: no-game-files
    attributes:
      label: No game files
      options:
        - label: Nothing attached here contains game files, keys or data extracted from a game.
          required: true
