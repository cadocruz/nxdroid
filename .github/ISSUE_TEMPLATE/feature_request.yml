name: Feature request
description: Ask for something nxdroid does not do yet
body:
  - type: markdown
    attributes:
      value: |
        A new device class, a second implementation of an existing path, or a change of more than about 1,000 lines: agree on the scope here first ([CONTRIBUTING.md](https://github.com/cadocruz/nxdroid/blob/main/CONTRIBUTING.md#large-changes)).
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: What you want to do and what stops you today. A game, a device or a log line helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work, and the parts of nxdroid it touches, if you know them.
    validations:
      required: false
  - type: input
    id: platforms
    attributes:
      label: Devices
      placeholder: "Galaxy S23 Ultra (Adreno 740)"
    validations:
      required: false
