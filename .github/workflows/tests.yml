# Checks for the Android port that need no game files, keys, device or GPU, on GitHub's Linux runners.
# nxdroid is Android only (HANDOFF.md §2 *Platforms*): the Mac host, iOS app and Metal jobs this workflow used to run on the xcode-27 image are gone with it; the Apple
# sources stay in the tree until HANDOFF.md §8 item 10 removes them, and the tests that build them (dm/host/tests, dm/gfx/tests, dm/ios) are not run here.
# android-gates is the HANDOFF.md §5 gate list; android-build compiles the host with the NDK (green since 80f73ca); android-app compiles the app's Java with Gradle
# and runs its JVM unit tests (dm/android/app/src/test). All three must stay green.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAME: '0100152000022000'   # quoted: unquoted, YAML reads these digits as an octal number. Mario Kart 8 Deluxe: the profile run on the S23 Ultra (any profile builds; the checks are about code, not the game)
  NDK_VERSION: 29.0.14206865   # dm/android/app/build.gradle ndkVersion, HANDOFF.md §5
  # The app's build environment, as dm/android/docker/Dockerfile pins it (keep the two in step): SDK packages, and Gradle by version + SHA-256
  SDK_PACKAGES: platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.31.6
  GRADLE_VERSION: 9.8.1
  GRADLE_SHA256: dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment): a tag can be moved, a SHA cannot. Dependabot (github-actions) can raise them.
jobs:
  android-gates:
    name: Android gates (provenance, vocabularies, audit, docs, tool and engine source tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Vendored engine provenance (108 files, 13 adapted)
        run: python dm/tools/android_vendor.py --check
      - name: Opcode and ABI vocabularies match the tree
        env:
          CC: gcc
        run: |
          python dm/gfx/vk/engine_smoke/opcode_map.py --check
          python dm/gfx/vk/engine_smoke/abi_gaps.py --check
      - name: Host portability audit (the baseline only shrinks)
        run: python dm/tools/android_audit.py --check
      - name: Symptom index is current
        run: python dm/tools/docs_symptoms.py --check
      - name: Engine source checks (text checks, no compile)
        run: |
          failed=0
          for t in pipeline_memo_source_test event_order_test source_structure_test copy_stride_test; do
            echo "::group::$t"
            python "dm/gfx/vulkan/engine/tests/$t.py" || { echo "::error::$t failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - name: pytest (the probe contract's tests are plain functions, which unittest does not collect)
        run: python -m pip install pytest
      - name: Tool tests
        run: |
          annotate() {   # $1 title, $2 log: the log's last 40 lines as an error annotation (the job log needs a signed-in user; annotations do not)
            local m; m=$(tail -n 40 "$2"); m=${m//'%'/'%25'}; m=${m//$'\r'/'%0D'}; m=${m//$'\n'/'%0A'}; echo "::error title=$1::$m"
          }
          failed=0
          for f in dm/tools/tests/test_docs.py dm/tools/tests/test_android_vendor.py dm/tools/tests/test_android_audit.py \
                   dm/tools/tests/test_thread_slots.py dm/tools/tests/test_android_undef_scan.py dm/tools/tests/test_android_jni.py \
                   dm/tools/tests/test_android_vm_alias.py dm/tools/tests/test_launcher_settings.py dm/tools/tests/test_env_switches.py \
                   dm/gfx/vk/probe/tests/test_probe_output.py; do
            echo "::group::$f"
            rc=0
            if [[ $f == */probe/* ]]; then python -m pytest -q "$f" > test.log 2>&1 || rc=$?
            else python -m unittest -v "$f" > test.log 2>&1 || rc=$?; fi
            cat test.log
            echo "::endgroup::"
            if [ "$rc" != 0 ]; then annotate "$f" test.log; failed=1; fi
          done
          exit $failed

  android-build:
    name: Android host compiled with the NDK (dmhost and libdm.so, arm64-v8a, API 29)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: NDK of the Gradle build
        run: |
          annotate() {   # $1 title, $2 log: the log's last 40 lines as an error annotation (the job log needs a signed-in user; annotations do not)
            local m; m=$(tail -n 40 "$2"); m=${m//'%'/'%25'}; m=${m//$'\r'/'%0D'}; m=${m//$'\n'/'%0A'}; echo "::error title=$1::$m"
          }
          sdk_root=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "NDKs on the image:"; ls "$sdk_root/ndk" || true
          if [ ! -d "$sdk_root/ndk/$NDK_VERSION" ]; then
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            set +o pipefail   # yes ends on SIGPIPE when sdkmanager stops reading; that is not a failure
            yes | "$sdkmanager" --licenses > licenses.log 2>&1 || true
            set -o pipefail
            "$sdkmanager" --install "ndk;$NDK_VERSION" > ndk.log 2>&1 || { cat ndk.log; annotate "sdkmanager ndk;$NDK_VERSION" ndk.log; exit 1; }
          fi
          echo "NDK=$sdk_root/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          annotate() {   # $1 title, $2 log: the log's last 40 lines as an error annotation (the job log needs a signed-in user; annotations do not)
            local m; m=$(tail -n 40 "$2"); m=${m//'%'/'%25'}; m=${m//$'\r'/'%0D'}; m=${m//$'\n'/'%0A'}; echo "::error title=$1::$m"
          }
          cmake -S dm/android -B build/android/$GAME -DGAME=$GAME -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" > configure.log 2>&1 || { cat configure.log; grep -A12 "CMake Error" configure.log | head -60 > errors.log; [ -s errors.log ] || cp configure.log errors.log; annotate configure errors.log; exit 1; }
          cat configure.log
      - name: Build dmhost and libdm.so
        run: |
          annotate() {   # $1 title, $2 log: the log's last 40 lines as an error annotation (the job log needs a signed-in user; annotations do not)
            local m; m=$(tail -n 40 "$2"); m=${m//'%'/'%25'}; m=${m//$'\r'/'%0D'}; m=${m//$'\n'/'%0A'}; echo "::error title=$1::$m"
          }
          cmake --build build/android/$GAME --target dmhost dm -j4 > build.log 2>&1 || { cat build.log; grep -E "error:|undefined" build.log | head -60 > errors.log; [ -s errors.log ] || cp build.log errors.log; annotate build errors.log; exit 1; }
          cat build.log

  android-app:
    name: Android app's Java compiled with Gradle, JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK packages, JDK 17 and Gradle of the Dockerfile
        run: |
          annotate() {   # $1 title, $2 log: the log's last 40 lines as an error annotation (the job log needs a signed-in user; annotations do not)
            local m; m=$(tail -n 40 "$2"); m=${m//'%'/'%25'}; m=${m//$'\r'/'%0D'}; m=${m//$'\n'/'%0A'}; echo "::error title=$1::$m"
          }
          sdk_root=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail   # yes ends on SIGPIPE when sdkmanager stops reading; that is not a failure
          yes | "$sdkmanager" --licenses > licenses.log 2>&1 || true
          set -o pipefail
          # word splitting is wanted: one argument per package
          # shellcheck disable=SC2086
          "$sdkmanager" --install $SDK_PACKAGES > sdk.log 2>&1 || { cat sdk.log; annotate "sdkmanager $SDK_PACKAGES" sdk.log; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"   # the runner image's JDK 17 (the Dockerfile's openjdk-17)
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "${GRADLE_SHA256}  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Compile the Java and run the unit tests
        run: |
          annotate() {   # $1 title, $2 log: the log's last 40 lines as an error annotation (the job log needs a signed-in user; annotations do not)
            local m; m=$(tail -n 40 "$2"); m=${m//'%'/'%25'}; m=${m//$'\r'/'%0D'}; m=${m//$'\n'/'%0A'}; echo "::error title=$1::$m"
          }
          # No native build here (android-build compiles libdm.so): compiling the Java and the JVM tests does not run CMake
          gradle -p dm/android --no-daemon --stacktrace -PdmGame="$GAME" :app:compileDebugJavaWithJavac :app:testDebugUnitTest > gradle.log 2>&1 || {
            cat gradle.log
            grep -hE "error:|FAILED|AssertionError|Exception" gradle.log | head -60 > errors.log || true   # bash -e -o pipefail: no match is not a failure here
            for x in dm/android/app/build/test-results/testDebugUnitTest/*.xml; do if [ -f "$x" ]; then grep -A3 "<failure" "$x" >> errors.log || true; fi; done
            [ -s errors.log ] || cp gradle.log errors.log
            annotate "gradle" errors.log; exit 1; }
          cat gradle.log
          grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' dm/android/app/build/test-results/testDebugUnitTest/*.xml || true
