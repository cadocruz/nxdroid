# Checks for the Android port that need no game files, keys, device or GPU, on GitHub's Linux runners.
# nxdroid is Android only (HANDOFF.md §2 *Platforms*): the Mac host, iOS app and Metal jobs this workflow used to run on the xcode-27 image are gone with it; the Apple
# sources stay in the tree until HANDOFF.md §8 item 10 removes them, and the tests that build them (dm/host/tests, dm/gfx/tests, dm/ios) are not run here.
# android-gates is the HANDOFF.md §5 gate list and must stay green. android-build compiles the host with the NDK; it is advisory (continue-on-error) until it has
# passed once on GitHub, then the flag goes.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAME: 0100152000022000   # Mario Kart 8 Deluxe: the profile run on the S23 Ultra (any profile builds; the checks are about code, not the game)
  NDK_VERSION: 29.0.14206865   # dm/android/app/build.gradle ndkVersion, HANDOFF.md §5

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment): a tag can be moved, a SHA cannot. Dependabot (github-actions) can raise them.
jobs:
  android-gates:
    name: Android gates (provenance, vocabularies, audit, docs, tool and engine source tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Vendored engine provenance (108 files, 11 adapted)
        run: python dm/tools/android_vendor.py --check
      - name: Opcode and ABI vocabularies match the tree
        env:
          CC: gcc
        run: |
          python dm/gfx/vk/engine_smoke/opcode_map.py --check
          python dm/gfx/vk/engine_smoke/abi_gaps.py --check
      - name: Host portability audit (the baseline only shrinks)
        run: python dm/tools/android_audit.py --check
      - name: Symptom index is current
        run: python dm/tools/docs_symptoms.py --check
      - name: Engine source checks (text checks, no compile)
        run: |
          failed=0
          for t in pipeline_memo_source_test event_order_test source_structure_test copy_stride_test; do
            echo "::group::$t"
            python "dm/gfx/vulkan/engine/tests/$t.py" || { echo "::error::$t failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - name: Tool tests
        run: |
          failed=0
          for f in dm/tools/tests/test_docs.py dm/tools/tests/test_android_vendor.py dm/tools/tests/test_android_audit.py \
                   dm/tools/tests/test_thread_slots.py dm/tools/tests/test_android_undef_scan.py dm/tools/tests/test_android_jni.py \
                   dm/tools/tests/test_android_vm_alias.py dm/tools/tests/test_launcher_settings.py dm/gfx/vk/probe/tests/test_probe_output.py; do
            echo "::group::$f"
            python -m unittest -v "$f" || { echo "::error::$f failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

  android-build:
    name: Android host compiled with the NDK (dmhost and libdm.so, arm64-v8a, API 29)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true   # advisory until its first green run on GitHub (see the header)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: NDK of the Gradle build
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          cmake -S dm/android -B build/android/$GAME -DGAME=$GAME -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"
      - name: Build dmhost and libdm.so
        run: cmake --build build/android/$GAME --target dmhost dm -j4
